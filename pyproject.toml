[project]
name = "alphamind"
version = "0.1.0"
description = "Real-time call intelligence for foreign residents in Japan."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "livekit-agents[silero]>=1.7,<2",
  "numpy>=1.26,<3",
  "pydantic>=2.10,<3",
  "sherpa-onnx==1.13.8",
  "sherpa-onnx-core==1.13.8",
  "strands-agents>=1.0,<2",
  "vifu>=0.1.7,<0.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
